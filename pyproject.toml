[project]
name = "schreinerei"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "wagtail>=7.0,<8.0",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "python-decouple>=3.8",
    "dj-database-url>=2.1",
    "psycopg2-binary>=2.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "wagtail-factories>=4.0",
    "factory-boy>=3.3",
    "ruff>=0.3",
    "django-debug-toolbar>=4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v"
# Note: browser tests require Playwright Chromium. On Linux without system libs,
# set LD_LIBRARY_PATH=/home/linuxbrew/.linuxbrew/lib before running pytest.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest-playwright>=0.7.2",
]
