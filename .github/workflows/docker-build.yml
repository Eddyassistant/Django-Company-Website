name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.local-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine local test tag
        id: local-tag
        run: echo "tag=snedkeri-test:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image for testing (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.local-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ steps.local-tag.outputs.tag }} -o /tmp/docker-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/docker-image.tar

      - name: Start container
        run: |
          docker run -d \
            --name snedkeri-test \
            -p 8000:8000 \
            -e SECRET_KEY=smoke-test-secret-key-not-for-production \
            -e DATABASE_URL=sqlite:////app/db.sqlite3 \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e ALLOWED_HOSTS='*' \
            -e DEBUG=False \
            -e SECURE_SSL_REDIRECT=False \
            ${{ needs.build.outputs.image-tag }}

      - name: Smoke test endpoints
        run: |
          BASE="http://localhost:8000"

          echo "⏳ Waiting for container..."
          for i in $(seq 1 30); do
            if curl -sf "$BASE/health/" > /dev/null 2>&1; then
              echo "✅ Container ready after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "❌ Container failed to start"
              docker logs snedkeri-test
              exit 1
            fi
            sleep 1
          done

          # Small buffer for gunicorn workers to stabilize
          sleep 2

          echo "--- Health endpoint ---"
          STATUS=$(curl -sf "$BASE/health/")
          echo "Response: $STATUS"
          echo "$STATUS" | grep -q '"status"' || (echo "❌ Bad health response" && exit 1)
          echo "✅ Health OK"

          echo "--- Homepage ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: localhost' "$BASE/")
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -lt 400 ] || (echo "❌ Homepage error" && exit 1)
          echo "✅ Homepage OK"

          echo "--- Static files ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/static/css/custom.css")
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -eq 200 ] || (echo "❌ Static files broken" && exit 1)
          echo "✅ Static files OK"

          echo "--- Wagtail admin ---"
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/admin/login/")
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -eq 200 ] || (echo "❌ Admin broken" && exit 1)
          echo "✅ Admin OK"

          echo ""
          echo "🎉 All smoke tests passed!"

      - name: Print container logs
        if: always()
        run: docker logs snedkeri-test

      - name: Cleanup
        if: always()
        run: docker rm -f snedkeri-test

  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
