name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.local-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine local test tag
        id: local-tag
        run: echo "tag=snedkeri-test:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image for testing (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.local-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ steps.local-tag.outputs.tag }} -o /tmp/docker-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar
          retention-days: 1

  smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/docker-image.tar

      - name: Start container
        run: |
          docker run -d \
            --name snedkeri-test \
            -p 8000:8000 \
            -e SECRET_KEY=smoke-test-secret-key-not-for-production \
            -e DATABASE_URL=sqlite:////app/db.sqlite3 \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e ALLOWED_HOSTS='*' \
            -e DEBUG=False \
            ${{ needs.build.outputs.image-tag }}

      - name: Wait for container to be ready
        run: |
          echo "Waiting for container to start..."
          for i in $(seq 1 30); do
            if docker exec snedkeri-test curl -sf http://localhost:8000/health/ > /dev/null 2>&1; then
              echo "✅ Health check passed after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ Container failed to become healthy"
          docker logs snedkeri-test
          exit 1

      - name: Verify health endpoint
        run: |
          STATUS=$(docker exec snedkeri-test curl -s http://localhost:8000/health/)
          echo "Health response: $STATUS"
          echo "$STATUS" | grep -q '"status"' || (echo "❌ Invalid health response" && exit 1)
          echo "✅ Health endpoint OK"

      - name: Verify homepage returns 200
        run: |
          HTTP_CODE=$(docker exec snedkeri-test curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)
          echo "Homepage HTTP status: $HTTP_CODE"
          # 200 (if demo data loaded) or 302 (redirect) are both acceptable
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Homepage returned $HTTP_CODE"
            docker logs snedkeri-test
            exit 1
          fi
          echo "✅ Homepage OK ($HTTP_CODE)"

      - name: Verify static files served
        run: |
          HTTP_CODE=$(docker exec snedkeri-test curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/static/css/custom.css)
          echo "Static file HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Static files not served"
            exit 1
          fi
          echo "✅ Static files OK"

      - name: Verify Wagtail admin loads
        run: |
          HTTP_CODE=$(docker exec snedkeri-test curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/login/)
          echo "Admin login HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Admin login page failed"
            docker logs snedkeri-test
            exit 1
          fi
          echo "✅ Wagtail admin OK"

      - name: Print container logs
        if: always()
        run: docker logs snedkeri-test

      - name: Cleanup
        if: always()
        run: docker rm -f snedkeri-test

  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [build, smoke-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
