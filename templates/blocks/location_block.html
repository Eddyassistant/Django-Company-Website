{% load wagtailcore_tags %}
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-4" style="color: var(--primary);">{{ value.heading }}</h2>
        <div class="row justify-content-center">
            <div class="col-md-8">
                <p class="text-center fs-5">
                    <i class="bi bi-geo-alt-fill me-2" style="color: var(--primary);"></i>{{ value.address }}
                </p>
                {% if value.map_embed %}
                    <div class="mt-3 rounded overflow-hidden shadow">
                        {{ value.map_embed }}
                    </div>
                {% endif %}
            </div>
        </div>
    </div>
</section>
