{% load wagtailcore_tags %}
<section class="py-5" style="{% if value.background == 'dark' %}background-color: var(--dark); color: var(--light);{% elif value.background == 'light' %}background-color: var(--light);{% else %}background-color: var(--primary); color: white;{% endif %}">
    <div class="container text-center">
        <h2 class="mb-3">{{ value.heading }}</h2>
        {% if value.text %}<p class="lead mb-4">{{ value.text }}</p>{% endif %}
        {% if value.button_link %}
            <a href="{% pageurl value.button_link %}" class="btn btn-lg {% if value.background == 'light' %}btn-dark{% else %}btn-light{% endif %}">{{ value.button_text }}</a>
        {% elif value.button_url %}
            <a href="{{ value.button_url }}" class="btn btn-lg {% if value.background == 'light' %}btn-dark{% else %}btn-light{% endif %}">{{ value.button_text }}</a>
        {% endif %}
    </div>
</section>
