{% load wagtailcore_tags %}
<section id="kontakt" class="py-5" style="background-color: var(--dark); color: var(--light);">
    <div class="container text-center">
        <h2 class="mb-3">{{ value.heading }}</h2>
        {% if value.text %}
            <p class="lead mb-4">{{ value.text }}</p>
        {% endif %}
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="row g-3">
                    {% if value.address %}
                    <div class="col-md-4">
                        <i class="bi bi-geo-alt fs-2" style="color: var(--primary);"></i>
                        <p class="mt-2">{{ value.address }}</p>
                    </div>
                    {% endif %}
                    {% if value.phone %}
                    <div class="col-md-4">
                        <i class="bi bi-telephone fs-2" style="color: var(--primary);"></i>
                        <p class="mt-2">{{ value.phone }}</p>
                    </div>
                    {% endif %}
                    {% if value.email %}
                    <div class="col-md-4">
                        <i class="bi bi-envelope fs-2" style="color: var(--primary);"></i>
                        <p class="mt-2">{{ value.email }}</p>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</section>
