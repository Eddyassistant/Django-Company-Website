{% load wagtailcore_tags %}
<section class="py-5" style="{% if value.background == 'dark' %}background-color: var(--dark); color: var(--light);{% elif value.background == 'light' %}background-color: var(--light);{% else %}background-color: #fff;{% endif %}">
    <div class="container">
        {% if value.heading %}
            <h2 class="mb-4" style="color: {% if value.background == 'dark' %}var(--light){% else %}var(--primary){% endif %};">{{ value.heading }}</h2>
        {% endif %}
        <div class="rich-text">{{ value.content }}</div>
    </div>
</section>
