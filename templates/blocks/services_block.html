{% load wagtailcore_tags %}
<section class="py-5">
    <div class="container">
        <h2 class="text-center mb-5" style="color: var(--primary);">{{ value.heading }}</h2>
        <div class="row g-4">
            {% for service in value.services %}
                <div class="col-md-4">
                    <div class="card h-100 border-0 shadow-sm text-center p-4">
                        {% if service.icon %}
                            <i class="bi {{ service.icon }} mb-3" style="font-size: 3rem; color: var(--primary);"></i>
                        {% endif %}
                        <h4>{{ service.title }}</h4>
                        <div>{{ service.description }}</div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
